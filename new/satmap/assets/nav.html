<!DOCTYPE html>
<!-- satmap-template-version: 2.0.4 -->
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 免缓存：避免浏览器留着旧版首页，导致维度链接算错 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>__PAGE_TITLE__</title>
    <style>
        /* ===== CSS Variables (主题) ===== */
        :root {
            /* 默认暗色主题 (Dark) */
            --bg-color: #0b0e1a;
            --container-bg: #1a1e2f;
            --text-color: #eee;
            --subtitle-color: #8888aa;
            --border-color: #2a2f45;
            --card-bg: #131726;
            --card-hover: #242b45;
            --player-item-bg: #1b2036;
            --player-border: #4a5070;
            --dim-badge-bg: #2a3048;
            --badge-text: #c0c8e0;
            --chat-border: #6a6f90;
            --chat-player: #d0d8f0;
            --chat-text: #e8eef0;
            --chat-time: #7a80a0;
            --footer-color: #4a5070;
            --empty-msg: #6a7090;
            --scrollbar-track: #1e2338;
            --scrollbar-thumb: #3f4668;
            --shadow-color: rgba(0,0,0,0.8);
            --dim-btn-shadow: rgba(0,0,0,0.4);
            --dim-btn-hover-shadow: rgba(0,0,0,0.7);
        }

        /* 日间主题 (Light) */
        [data-theme="light"] {
            --bg-color: #f0f2f5;
            --container-bg: #ffffff;
            --text-color: #222;
            --subtitle-color: #666;
            --border-color: #d0d5dd;
            --card-bg: #f8f9fc;
            --card-hover: #e9ecf3;
            --player-item-bg: #ffffff;
            --player-border: #b0b8c8;
            --dim-badge-bg: #e0e4ee;
            --badge-text: #333;
            --chat-border: #b0b8c8;
            --chat-player: #1a1e2f;
            --chat-text: #222;
            --chat-time: #888;
            --footer-color: #888;
            --empty-msg: #999;
            --scrollbar-track: #e0e4ee;
            --scrollbar-thumb: #b0b8c8;
            --shadow-color: rgba(0,0,0,0.15);
            --dim-btn-shadow: rgba(0,0,0,0.15);
            --dim-btn-hover-shadow: rgba(0,0,0,0.25);
        }

        /* 森林绿 (Forest) */
        [data-theme="forest"] {
            --bg-color: #1a2a1f;
            --container-bg: #2a3d2a;
            --text-color: #d4e6c9;
            --subtitle-color: #9bb89b;
            --border-color: #3e5a3e;
            --card-bg: #1f321f;
            --card-hover: #2d452d;
            --player-item-bg: #253a25;
            --player-border: #5a7a5a;
            --dim-badge-bg: #3a553a;
            --badge-text: #d4e6c9;
            --chat-border: #5a7a5a;
            --chat-player: #b8d4b8;
            --chat-text: #d4e6c9;
            --chat-time: #8aaa8a;
            --footer-color: #6a8a6a;
            --empty-msg: #6a8a6a;
            --scrollbar-track: #1f321f;
            --scrollbar-thumb: #3e5a3e;
            --shadow-color: rgba(0,20,0,0.6);
        }

        /* 暖阳 (Warm) */
        [data-theme="warm"] {
            --bg-color: #2d1f14;
            --container-bg: #4a3424;
            --text-color: #f5e6d3;
            --subtitle-color: #c4a88a;
            --border-color: #5a4534;
            --card-bg: #3a281c;
            --card-hover: #4d3628;
            --player-item-bg: #3f2c1e;
            --player-border: #8a6a52;
            --dim-badge-bg: #5a4534;
            --badge-text: #f5e6d3;
            --chat-border: #8a6a52;
            --chat-player: #e6cbb8;
            --chat-text: #f5e6d3;
            --chat-time: #b09078;
            --footer-color: #8a6a52;
            --empty-msg: #8a6a52;
            --scrollbar-track: #3a281c;
            --scrollbar-thumb: #5a4534;
            --shadow-color: rgba(30,15,5,0.6);
        }

        /* 海洋蓝 (Ocean) */
        [data-theme="ocean"] {
            --bg-color: #0c1a2b;
            --container-bg: #1a2f44;
            --text-color: #c8dce8;
            --subtitle-color: #8ab0c8;
            --border-color: #2a4a5a;
            --card-bg: #132838;
            --card-hover: #1e3a4e;
            --player-item-bg: #183240;
            --player-border: #4a7a8a;
            --dim-badge-bg: #2a4a5a;
            --badge-text: #c8dce8;
            --chat-border: #4a7a8a;
            --chat-player: #b0d0e0;
            --chat-text: #c8dce8;
            --chat-time: #7aa0b0;
            --footer-color: #5a7a8a;
            --empty-msg: #5a7a8a;
            --scrollbar-track: #132838;
            --scrollbar-thumb: #2a4a5a;
            --shadow-color: rgba(0,10,20,0.6);
        }

        /* 樱花粉 (Sakura) */
        [data-theme="sakura"] {
            --bg-color: #2d1a2a;
            --container-bg: #4a2a44;
            --text-color: #f0d4e0;
            --subtitle-color: #c890b0;
            --border-color: #5a3a54;
            --card-bg: #3a2238;
            --card-hover: #4d3048;
            --player-item-bg: #3f2a3a;
            --player-border: #8a5a7a;
            --dim-badge-bg: #5a3a54;
            --badge-text: #f0d4e0;
            --chat-border: #8a5a7a;
            --chat-player: #e0b8d0;
            --chat-text: #f0d4e0;
            --chat-time: #b080a0;
            --footer-color: #8a5a7a;
            --empty-msg: #8a5a7a;
            --scrollbar-track: #3a2238;
            --scrollbar-thumb: #5a3a54;
            --shadow-color: rgba(30,10,20,0.6);
        }

        /* 极光紫 (Aurora) */
        [data-theme="aurora"] {
            --bg-color: #14102a;
            --container-bg: #242044;
            --text-color: #d4c8f0;
            --subtitle-color: #9888c8;
            --border-color: #3a345a;
            --card-bg: #1e1a3a;
            --card-hover: #2e2a4e;
            --player-item-bg: #242040;
            --player-border: #6a5a8a;
            --dim-badge-bg: #3a345a;
            --badge-text: #d4c8f0;
            --chat-border: #6a5a8a;
            --chat-player: #c0b0e0;
            --chat-text: #d4c8f0;
            --chat-time: #9080b0;
            --footer-color: #6a5a8a;
            --empty-msg: #6a5a8a;
            --scrollbar-track: #1e1a3a;
            --scrollbar-thumb: #3a345a;
            --shadow-color: rgba(10,5,30,0.6);
        }

        /* ===== 全局样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 20% 0%, #243056 0%, transparent 55%),
                              radial-gradient(circle at 80% 100%, #3a2440 0%, transparent 55%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
            position: relative;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: var(--container-bg);
            border-radius: 32px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px var(--shadow-color);
            position: relative;
            z-index: 1;
            transition: background 0.3s, box-shadow 0.3s;
        }

        h1 {
            text-align: center;
            font-size: 2.6rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .subtitle {
            text-align: center;
            color: var(--subtitle-color);
            margin-bottom: 30px;
            font-size: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            transition: color 0.3s, border-color 0.3s;
        }

        .dimension-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }
        .dim-btn {
            display: block;
            padding: 24px 10px;
            border-radius: 18px;
            text-align: center;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.5rem;
            color: white;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 6px 20px var(--dim-btn-shadow);
            border: none;
            cursor: pointer;
        }
        .dim-btn:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px var(--dim-btn-hover-shadow);
        }
        .dim-btn.overworld { background: linear-gradient(145deg, #2b7a4b, #1e5a37); }
        .dim-btn.nether { background: linear-gradient(145deg, #b03a2e, #7a261c); }
        .dim-btn.the_end { background: linear-gradient(145deg, #6a3f8a, #462a5e); }
        .dim-btn.custom { background: linear-gradient(145deg, #3a6a8a, #264a66); }
        .dim-btn .icon {
            font-size: 2.8rem;
            display: block;
            margin-bottom: 8px;
        }
        .dim-btn .label {
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .players-section, .chat-section {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            margin-top: 10px;
            transition: background 0.3s;
        }
        .chat-section {
            margin-top: 20px;
        }
        .section-title {
            font-size: 1.4rem;
            margin-bottom: 15px;
            color: var(--badge-text);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: color 0.3s;
        }
        .section-title .badge {
            background: var(--dim-badge-bg);
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 0.9rem;
            color: var(--badge-text);
            transition: background 0.3s, color 0.3s;
        }

        #player-list, #chat-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }
        #chat-list {
            max-height: 300px;
        }
        #player-list::-webkit-scrollbar, #chat-list::-webkit-scrollbar {
            width: 6px;
        }
        #player-list::-webkit-scrollbar-track, #chat-list::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
            border-radius: 10px;
        }
        #player-list::-webkit-scrollbar-thumb, #chat-list::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 10px;
        }

        .player-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--player-item-bg);
            padding: 12px 18px;
            border-radius: 14px;
            border-left: 5px solid var(--player-border);
            transition: background 0.15s, border-color 0.3s;
        }
        .player-item:hover {
            background: var(--card-hover);
        }
        .player-name {
            font-weight: 600;
            font-size: 1.1rem;
            min-width: 120px;
        }
        .player-dim {
            font-size: 0.9rem;
            padding: 2px 14px;
            border-radius: 30px;
            background: var(--dim-badge-bg);
            color: var(--badge-text);
            min-width: 80px;
            text-align: center;
            transition: background 0.3s, color 0.3s;
        }
        .player-dim.dim-overworld { background: #1e5a37; color: #b0e0b0; }
        .player-dim.dim-nether { background: #7a261c; color: #f0b0a0; }
        .player-dim.dim-the_end { background: #462a5e; color: #d0b0f0; }
        .player-coords {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: var(--chat-time);
            min-width: 140px;
            text-align: right;
            transition: color 0.3s;
        }

        /* 聊天消息样式 */
        .chat-message {
            background: var(--player-item-bg);
            padding: 10px 16px;
            border-radius: 14px;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 6px 12px;
            border-left: 5px solid var(--chat-border);
            transition: background 0.15s, border-color 0.3s;
        }
        .chat-message:hover {
            background: var(--card-hover);
        }
        .chat-player {
            font-weight: 600;
            color: var(--chat-player);
            min-width: 80px;
            transition: color 0.3s;
        }
        .chat-text {
            flex: 1;
            color: var(--chat-text);
            word-break: break-word;
            transition: color 0.3s;
        }
        .chat-time {
            font-size: 0.75rem;
            color: var(--chat-time);
            white-space: nowrap;
            margin-left: auto;
            transition: color 0.3s;
        }
        .empty-msg {
            color: var(--empty-msg);
            text-align: center;
            padding: 30px 0;
            font-style: italic;
            transition: color 0.3s;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            color: var(--footer-color);
            font-size: 0.85rem;
            transition: color 0.3s;
        }

        /* ===== 移动端适配 ===== */
        @media (max-width: 700px) {
            .dimension-grid {
                grid-template-columns: 1fr;
            }
            .player-item {
                flex-wrap: wrap;
                gap: 6px;
            }
            .player-name { min-width: 80px; }
            .player-coords { min-width: auto; text-align: left; }
            .chat-message {
                flex-wrap: wrap;
                gap: 4px 8px;
            }
            .chat-player {
                min-width: 60px;
                font-size: 0.95rem;
            }
            .chat-time {
                margin-left: 0;
                font-size: 0.7rem;
            }
            .chat-text {
                width: 100%;
                order: 3;
                margin-top: 2px;
            }
            .section-title {
                font-size: 1.2rem;
            }
        }
        @media (max-width: 480px) {
            .container {
                padding: 20px 15px;
            }
            h1 {
                font-size: 2.0rem;
            }
            .dim-btn {
                padding: 16px 10px;
                font-size: 1.2rem;
            }
            .dim-btn .icon {
                font-size: 2.0rem;
            }
            .player-item, .chat-message {
                padding: 10px 12px;
            }
            .player-name, .chat-player {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌍 卫星地图导航</h1>
        <div class="subtitle">__SUBTITLE__</div>

        <div class="dimension-grid">
__DIM_CARDS__
        </div>

        <div class="players-section">
            <div class="section-title">
                🧑‍🤝‍🧑 在线玩家
                <span class="badge" id="player-count">0</span>
            </div>
            <div id="player-list">
                <div class="empty-msg">加载中喵…</div>
            </div>
        </div>

        <div class="chat-section">
            <div class="section-title">
                💬 聊天记录
                <span class="badge" id="chat-count">0</span>
            </div>
            <div id="chat-list">
                <div class="empty-msg">加载中喵…</div>
            </div>
        </div>

        <div class="footer">🔄 数据每 __REFRESH_SEC__ 秒自动刷新喵</div>
    </div>

    <script>
        (function () {
            // ----- 主题（沿用旧的本地设置，默认暗色）-----
            const savedTheme = localStorage.getItem('satmap-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);

            // ----- 由插件注入 -----
            const PLAYERS_JSON = '__PLAYERS_JSON__';
            const CHAT_JSON = '__CHAT_JSON__';
            const REFRESH_MS = __REFRESH_MS__;
            const FORCE_PREFIX = '__URL_PREFIX__';   // 留空 = 自动推断

            // ----- 推断本站挂载前缀 -----
            // 访问 /map、/map/、/map/index.html、/ 都能得到正确的 /map
            function computeBase() {
                let p = location.pathname || '/';
                p = p.replace(/index\.html$/i, '');
                p = p.replace(/\/+$/, '');
                return p;                 // '/map' 或 ''（根）
            }

            const BASE = FORCE_PREFIX || computeBase();
            function url(rel) {
                return BASE + '/' + rel;
            }

            // 兜底：链接通常由插件在服务端就写死成绝对地址（如 /map/overworld/）。
            // 只有当插件算不出挂载前缀（FORCE_PREFIX 为空）时，才在运行时按当前
            // 地址推断一次，避免点按钮没反应。
            if (!FORCE_PREFIX) {
                const dimLinks = document.querySelectorAll('a[data-dim]');
                for (let i = 0; i < dimLinks.length; i++) {
                    const dim = dimLinks[i].getAttribute('data-dim');
                    const linkStyle = dimLinks[i].getAttribute('data-link-style') || 'dir';
                    dimLinks[i].setAttribute(
                        'href',
                        url(linkStyle === 'file' ? dim + '/index.html' : dim + '/')
                    );
                }
            }

            // ----- DOM 引用 -----
            const playerListEl = document.getElementById('player-list');
            const countEl = document.getElementById('player-count');
            const chatListEl = document.getElementById('chat-list');
            const chatCountEl = document.getElementById('chat-count');

            // ----- 工具函数 -----
            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text == null ? '' : String(text);
                return div.innerHTML;
            }

            function formatCoord(v) {
                if (v === undefined || v === null) return '?';
                return Math.round(v);
            }

            function getDimensionClass(dim) {
                if (!dim) return '';
                const d = String(dim).toLowerCase();
                if (d.includes('overworld')) return 'dim-overworld';
                if (d.includes('nether')) return 'dim-nether';
                if (d.includes('the_end') || d.includes('end')) return 'dim-the_end';
                return '';
            }

            function getDimensionLabel(dim) {
                if (!dim) return '未知';
                const d = String(dim).toLowerCase().replace(/^minecraft:/, '');
                if (d.includes('overworld')) return '主世界';
                if (d.includes('nether')) return '下界';
                if (d.includes('the_end') || d.includes('end')) return '末地';
                return dim;
            }

            function formatTime(timestamp) {
                const date = new Date(timestamp * 1000);
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }

            // ----- 请求封装（带超时 + 绕缓存）-----
            function fetchJson(url, timeout) {
                return Promise.race([
                    fetch(url + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) {
                        if (!r.ok) throw new Error('HTTP ' + r.status);
                        return r.json();
                    }),
                    new Promise(function (_, reject) {
                        setTimeout(function () { reject(new Error('请求超时')); }, timeout || 5000);
                    })
                ]);
            }

            // ----- 获取玩家数据 -----
            function fetchPlayers() {
                return fetchJson(url(PLAYERS_JSON)).then(function (data) {
                    const names = Object.keys(data || {});
                    countEl.textContent = names.length;

                    if (names.length === 0) {
                        playerListEl.innerHTML = '<div class="empty-msg">😴 当前没有玩家在线喵</div>';
                        return;
                    }

                    let html = '';
                    names.forEach(function (name) {
                        const info = data[name] || {};
                        const dim = info.dim || 'unknown';
                        html += '<div class="player-item">' +
                            '<span class="player-name">' + escapeHtml(name) + '</span>' +
                            '<span class="player-dim ' + getDimensionClass(dim) + '">' + escapeHtml(getDimensionLabel(dim)) + '</span>' +
                            '<span class="player-coords">X ' + formatCoord(info.x) + ' &nbsp; Z ' + formatCoord(info.z) + '</span>' +
                            '</div>';
                    });
                    playerListEl.innerHTML = html;
                }).catch(function (err) {
                    console.warn('[导航] 获取玩家数据失败:', err);
                    playerListEl.innerHTML = '<div class="empty-msg">⚠️ 无法加载玩家数据，请检查网络喵</div>';
                });
            }

            // ----- 获取聊天记录 -----
            function fetchChat() {
                return fetchJson(url(CHAT_JSON)).then(function (data) {
                    const list = Array.isArray(data) ? data : [];
                    chatCountEl.textContent = list.length;

                    if (list.length === 0) {
                        chatListEl.innerHTML = '<div class="empty-msg">😶 还没有聊天记录喵</div>';
                        return;
                    }

                    let html = '';
                    list.forEach(function (entry) {
                        html += '<div class="chat-message">' +
                            '<span class="chat-player">' + escapeHtml(entry.player || '?') + '</span>' +
                            '<span class="chat-text">' + escapeHtml(entry.message || '') + '</span>' +
                            '<span class="chat-time">' + escapeHtml(entry.timestamp ? formatTime(entry.timestamp) : '') + '</span>' +
                            '</div>';
                    });
                    chatListEl.innerHTML = html;
                    chatListEl.scrollTop = chatListEl.scrollHeight;
                }).catch(function (err) {
                    console.warn('[导航] 获取聊天记录失败:', err);
                    chatListEl.innerHTML = '<div class="empty-msg">⚠️ 无法加载聊天记录，请检查网络喵</div>';
                });
            }

            // ----- 统一刷新（并行）-----
            function refreshAll() {
                Promise.all([fetchPlayers(), fetchChat()])
                    .catch(function (err) { console.warn('[导航] 刷新失败:', err); });
            }

            // 首次加载
            refreshAll();
            // 定时刷新
            setInterval(refreshAll, REFRESH_MS);
        })();
    </script>
</body>
</html>
